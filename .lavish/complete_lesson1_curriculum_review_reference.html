    // Audio Synthesizer Service
    class AudioService {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, type = 'sine', duration = 0.15) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playClick() { this.playTone(400, 'triangle', 0.05); }
      playSuccess() {
        this.playTone(523.25, 'sine', 0.1);
        setTimeout(() => this.playTone(659.25, 'sine', 0.15), 80);
        setTimeout(() => this.playTone(783.99, 'sine', 0.25), 160);
      }
      playError() { this.playTone(240, 'sawtooth', 0.18); }
      speakArabic(text) {
        this.playClick();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ar-SA';
          u.rate = 0.85;
          window.speechSynthesis.speak(u);
        }
      }
    }

    // NAVIGATION ENGINE

      const next = currentStep + delta;
      if (next >= 0 && next < stepsData.length) {
        currentStep = next;
        renderCanvas();
      }
    }

    function goToStep(idx) {
      audio.playClick();
      currentStep = idx;
      renderCanvas();
    }

    function tapVocab(id, arText) {

      revealedVocab[id] = true;

      selectedChips.push(word);

    }

      audio.playClick();
      verificationResult = null;
      selectedChips.splice(idx, 1);
      renderCanvas();
    }

      selectedChips = [];
      verificationResult = null;
      renderCanvas();

      const isCorrect = selectedChips.length === currentEx.expected.length &&

                    <div class="w-full flex items-center justify-between text-xs font-mono text-neutral-400">
                      <span>Card 0${idx + 1}</span>
                      <span class="${isTapped ? 'text-emerald-600 dark:text-emerald-400 font-bold' : ''}">${isTapped ? '✓' : ''}</span>

                  </div>

              }).join('')}
            </div>
          </div>
        `;
      }

      // STEP 1: PAGE 15 POINTER DEMONSTRATION TABLE (2 ROW, 2 COL TABLE STYLE MATCHING BOOK)
      else if (currentStep === 1) {
        html = `
          <div class="space-y-6">
            <div class="bg-neutral-100 dark:bg-neutral-900 p-6 sm:p-8 rounded-3xl space-y-6">
              
              <!-- 2-Column, 2-Row Table matching Page 15 layout exactly -->
              <div class="grid grid-cols-2 gap-4 text-center" dir="rtl">
                
                <!-- Row 1: Right Col (Arabic) | Left Col (English) -->

                  <span class="font-arabic text-4xl font-bold text-neutral-900 dark:text-neutral-100 block">هٰذَا - هٰذِهِ</span>
                  <span class="text-sm font-semibold text-neutral-600 dark:text-neutral-400 block mt-2" dir="ltr">This</span>
                </div>

                <div onclick="audio.speakArabic('ذٰلِكَ')" class="bg-white dark:bg-neutral-800 p-6 rounded-3xl cursor-pointer flex flex-col items-center justify-center">
                  <span class="font-arabic text-4xl font-bold text-neutral-900 dark:text-neutral-100 block">ذٰلِكَ - تِلْكَ</span>
                  <span class="text-sm font-semibold text-neutral-600 dark:text-neutral-400 block mt-2" dir="ltr">That</span>
                </div>

                <!-- Row 2: Right Col (Arabic) | Left Col (English) -->
                <div onclick="audio.speakArabic('هٰذَا كِتَابٌ')" class="bg-white dark:bg-neutral-800 p-6 rounded-3xl cursor-pointer flex flex-col items-center justify-center">
                  <span class="font-arabic text-3xl font-bold text-neutral-900 dark:text-neutral-100 block">هٰذَا كِتَابٌ</span>
                  <span class="text-sm font-semibold text-neutral-600 dark:text-neutral-400 block mt-2" dir="ltr">This is a book</span>
                </div>

                <div onclick="audio.speakArabic('ذٰلِكَ قَلَمٌ')" class="bg-white dark:bg-neutral-800 p-6 rounded-3xl cursor-pointer flex flex-col items-center justify-center">
                  <span class="font-arabic text-3xl font-bold text-neutral-900 dark:text-neutral-100 block">ذٰلِكَ قَلَمٌ</span>
                  <span class="text-sm font-semibold text-neutral-600 dark:text-neutral-400 block mt-2" dir="ltr">That is a pen</span>
                </div>

              </div>

            </div>
          </div>
        `;
      }

      // STEP 2: MASCULINE POINTING DRILLS (PAGES 15 & 16 - 17 ITEMS)
      else if (currentStep === 2) {
        html = `
          <div class="space-y-3">
            ${masculinePointSentences.map((item) => `
              <div onclick="audio.speakArabic('${item.ar}')" class="bg-neutral-100 dark:bg-neutral-900 p-4 rounded-3xl flex items-center justify-between cursor-pointer group hover:bg-neutral-200/80 dark:hover:bg-neutral-800/80 transition-colors" dir="rtl">
                
                <!-- Tag Badge on Right -->
                <div class="px-6 py-3.5 bg-neutral-200 text-neutral-900 dark:bg-neutral-700 dark:text-neutral-100 shrink-0 rounded-r-2xl price-tag-rtl transition-colors">
                  <span class="font-arabic text-2xl font-bold">${item.ar}</span>
                </div>

                <!-- Connecting Line & Image Placement -->
                <div class="flex-1 flex items-center ${item.distance === 'near' ? 'justify-start pr-6' : 'justify-end pl-6'}">
                  ${item.distance === 'near' ? `
                    <div class="flex items-center gap-3">
                      <div class="w-12 h-0.5 bg-neutral-300 dark:bg-neutral-700"></div>
                      <span class="text-4xl transition-transform group-hover:scale-110">${item.emoji}</span>
                    </div>
                  ` : `
                    <div class="flex items-center gap-3 w-full justify-end">
                      <div class="flex-1 h-0.5 bg-neutral-300 dark:bg-neutral-700 mx-4"></div>
                      <span class="text-3xl opacity-60 transition-transform group-hover:scale-110">${item.emoji}</span>
                    </div>
                  `}
                </div>

              </div>
            `).join('')}
          </div>
        `;
      }

      // STEP 3: VOCABULARY SET 2 (PAGE 17 TOP - 8 WORDS)
      else if (currentStep === 3) {
        html = `
          <div class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${feminineVocab.map((v, idx) => {
                const isTapped = revealedVocab[v.id];
                return `
                  <div onclick="tapVocab(${v.id}, '${v.ar}')" class="bg-neutral-100 dark:bg-neutral-900 hover:bg-neutral-200/80 dark:hover:bg-neutral-700/80 active:scale-95 transition-all p-6 rounded-3xl flex flex-col justify-between items-center text-center cursor-pointer min-h-[185px]">
                    <div class="w-full flex items-center justify-between text-xs font-mono text-neutral-400">
                      <span>Card 0${idx + 1}</span>
                      <span class="${isTapped ? 'text-emerald-600 dark:text-emerald-400 font-bold' : ''}">${isTapped ? '✓' : ''}</span>
                    </div>

                    <div class="my-2">
                      <span class="font-arabic text-3xl font-bold text-neutral-900 dark:text-neutral-100 block">${v.ar}</span>
                    </div>

                    <div class="w-full pt-2 border-t border-neutral-200/60 dark:border-neutral-800">
                      <span class="text-sm font-semibold text-neutral-700 dark:text-neutral-300 block">${v.en}</span>
                      ${isTapped ? `<span class="text-xs font-mono text-emerald-600 dark:text-emerald-400 font-semibold block mt-1">${v.roman}</span>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // STEP 4: FEMININE POINTING DRILLS (PAGES 17 & 18 - 13 EXAMPLES)
      else if (currentStep === 4) {
        html = `
          <div class="space-y-3">
            ${femininePointSentences.map((item) => `
              <div onclick="audio.speakArabic('${item.ar}')" class="bg-neutral-100 dark:bg-neutral-900 p-4 rounded-3xl flex items-center justify-between cursor-pointer group hover:bg-neutral-200/80 dark:hover:bg-neutral-800/80 transition-colors" dir="rtl">
                
                <!-- Tag Badge on Right -->
                <div class="px-6 py-3.5 bg-neutral-200 text-neutral-900 dark:bg-neutral-700 dark:text-neutral-100 shrink-0 rounded-r-2xl price-tag-rtl transition-colors">
                  <span class="font-arabic text-2xl font-bold">${item.ar}</span>
                </div>

                <!-- Connecting Line & Image Placement -->
                <div class="flex-1 flex items-center ${item.distance === 'near' ? 'justify-start pr-6' : 'justify-end pl-6'}">
                  ${item.distance === 'near' ? `
                    <div class="flex items-center gap-3">
                      <div class="w-12 h-0.5 bg-neutral-300 dark:bg-neutral-700"></div>
                      <span class="text-4xl transition-transform group-hover:scale-110">${item.emoji}</span>
                    </div>
                  ` : `
                    <div class="flex items-center gap-3 w-full justify-end">
                      <div class="flex-1 h-0.5 bg-neutral-300 dark:bg-neutral-700 mx-4"></div>
                      <span class="text-3xl opacity-60 transition-transform group-hover:scale-110">${item.emoji}</span>
                    </div>
                  `}

              </div>
            `).join('')}
          </div>
        `;

      // STEP 5: VOCABULARY SET 3 (PAGE 18 TOP - 8 WORDS)
      else if (currentStep === 5) {
        html = `
          <div class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${householdVocab.map((v, idx) => {
                const isTapped = revealedVocab[v.id];
                return `
                  <div onclick="tapVocab(${v.id}, '${v.ar}')" class="bg-neutral-100 dark:bg-neutral-900 hover:bg-neutral-200/80 dark:hover:bg-neutral-700/80 active:scale-95 transition-all p-6 rounded-3xl flex flex-col justify-between items-center text-center cursor-pointer min-h-[185px]">
                    <div class="w-full flex items-center justify-between text-xs font-mono text-neutral-400">
                      <span>Card 0${idx + 1}</span>
                      <span class="${isTapped ? 'text-emerald-600 dark:text-emerald-400 font-bold' : ''}">${isTapped ? '✓' : ''}</span>
                    </div>

                    <div class="my-2">
                      <span class="font-arabic text-3xl font-bold text-neutral-900 dark:text-neutral-100 block">${v.ar}</span>
                    </div>

                    <div class="w-full pt-2 border-t border-neutral-200/60 dark:border-neutral-800">
                      <span class="text-sm font-semibold text-neutral-700 dark:text-neutral-300 block">${v.en}</span>
                      ${isTapped ? `<span class="text-xs font-mono text-emerald-600 dark:text-emerald-400 font-semibold block mt-1">${v.roman}</span>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // STEP 6: PAGE 18 Q&A FORMULA BOX (TABLE MATCHING PAGE 18 LAYOUT EXACTLY)
      else if (currentStep === 6) {
        html = `
          <div class="space-y-6">
            <div class="bg-neutral-100 dark:bg-neutral-900 p-6 sm:p-8 rounded-3xl space-y-6">
              
              <!-- 2-Column Table matching Page 18 layout -->
              <div class="grid grid-cols-2 gap-4 text-center" dir="rtl">
                
                <div class="bg-white dark:bg-neutral-800 p-6 rounded-3xl flex flex-col items-center justify-center">
                  <span class="font-arabic text-3xl font-bold text-neutral-900 dark:text-neutral-100 block">مَا هٰذَا - مَا هٰذِهِ</span>
                  <span class="text-sm font-semibold text-neutral-600 dark:text-neutral-400 block mt-2" dir="ltr">What is this?</span>
                </div>

                <div class="bg-white dark:bg-neutral-800 p-6 rounded-3xl flex flex-col items-center justify-center">
                  <span class="font-arabic text-3xl font-bold text-neutral-900 dark:text-neutral-100 block">مَا ذٰلِكَ - مَا تِلْكَ</span>
                  <span class="text-sm font-semibold text-neutral-600 dark:text-neutral-400 block mt-2" dir="ltr">What is that?</span>
                </div>

              </div>

            </div>
          </div>
        `;
      }

      // STEP 7: Q&A DEMONSTRATION DRILLS (PAGE 18 BOTTOM - 4 ITEMS)
      else if (currentStep === 7) {
        html = `
          <div class="space-y-4">
            ${demoQAPairs.map((item) => `
              <div onclick="audio.speakArabic('${item.qAr} ${item.aAr}')" class="bg-neutral-100 dark:bg-neutral-900 p-5 rounded-3xl flex items-center justify-between cursor-pointer group hover:bg-neutral-200/80 dark:hover:bg-neutral-800/80 transition-colors" dir="rtl">
                
                <!-- Question Badge on Right (RTL) -->
                <div class="px-6 py-3.5 bg-neutral-200 text-neutral-900 dark:bg-neutral-700 dark:text-neutral-100 shrink-0 rounded-r-2xl price-tag-rtl transition-colors">
                  <span class="font-arabic text-2xl font-bold">${item.qAr}</span>
                </div>

                <!-- Image Placement based on Indicative Pronoun Distance -->
                <div class="flex-1 flex items-center ${item.distance === 'near' ? 'justify-start pr-6' : 'justify-end pl-6'}">
                  ${item.distance === 'near' ? `
                    <div class="flex items-center gap-3">
                      <div class="w-12 h-0.5 bg-neutral-300 dark:bg-neutral-700"></div>
                      <span class="text-4xl transition-transform group-hover:scale-110">${item.emoji}</span>
                    </div>
                  ` : `
                    <div class="flex items-center gap-3 w-full justify-end">
                      <div class="flex-1 h-0.5 bg-neutral-300 dark:bg-neutral-700 mx-4"></div>
                      <span class="text-3xl opacity-60 transition-transform group-hover:scale-110">${item.emoji}</span>
                    </div>
                  `}
                </div>

                <!-- Answer Badge on Left (RTL) -->
                <div class="px-6 py-3.5 bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-950 shrink-0 rounded-l-2xl price-tag-ltr transition-colors">
                  <span class="font-arabic text-2xl font-bold">${item.aAr}</span>
                </div>

              </div>
            `).join('')}
          </div>
        `;
      }

      // STEP 8: INTERACTIVE PICTURE Q&A (PAGE 19 - 11 EXERCISES)
      else if (currentStep === 8) {
        const currentEx = fullQAExercises[activeQAIndex];
        html = `
          <div class="space-y-5">
            <div class="flex items-center justify-between">
              <span class="px-3.5 py-1.5 rounded-full text-xs font-mono bg-neutral-100 dark:bg-neutral-900 text-neutral-800 dark:text-neutral-200 font-bold">
                Exercise ${activeQAIndex + 1} of ${fullQAExercises.length}
              </span>
            </div>

            <!-- INTERACTIVE ASSEMBLY CANVAS -->
            <div class="bg-neutral-100 dark:bg-neutral-900 rounded-3xl p-6 space-y-5">
              <!-- Exercise Controls Bar -->
              <div class="flex items-center justify-between">
                <button onclick="navQA(-1)" ${activeQAIndex === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-full text-xs font-semibold bg-white dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-neutral-200 dark:hover:bg-neutral-700 transition-colors">
                  ← Previous
                </button>
                <span class="text-xs font-mono font-semibold text-neutral-500 dark:text-neutral-400">
                  Question ${activeQAIndex + 1} / ${fullQAExercises.length}
                </span>
                <button onclick="navQA(1)" ${activeQAIndex === fullQAExercises.length - 1 ? 'disabled' : ''} class="px-4 py-2 rounded-full text-xs font-semibold bg-white dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-neutral-200 dark:hover:bg-neutral-700 transition-colors">
                  Next →
                </button>
              </div>

              <!-- Question Display Box -->
              <div class="bg-white dark:bg-neutral-800 p-5 rounded-2xl flex items-center justify-between" dir="rtl">
                <div class="flex items-center gap-4">
                  <span class="text-4xl">${currentEx.emoji}</span>
                  <div>
                    <span class="font-arabic font-bold text-3xl text-neutral-900 dark:text-neutral-100 block">${currentEx.questionAr}</span>
                  </div>
                </div>
                <button onclick="audio.speakArabic('${currentEx.questionAr}')" class="p-3 bg-neutral-100 dark:bg-neutral-700 hover:bg-neutral-200 dark:hover:bg-neutral-600 rounded-full transition-colors" title="Play Question Audio">
                  🔊
                </button>
              </div>

              <!-- Selected Answer Slot -->
              <div class="bg-white dark:bg-neutral-800 min-h-[80px] rounded-2xl p-4 flex items-center justify-center flex-wrap gap-3" dir="rtl">
                ${selectedChips.length === 0 ? `
                  <span class="text-xs text-neutral-400 dark:text-neutral-500" dir="ltr">
                    Tap word chips below to assemble answer
                  </span>
                ` : selectedChips.map((chip, index) => `
                  <button onclick="removeChip(${index})" class="bg-neutral-100 dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100 font-arabic font-semibold text-xl px-5 py-2.5 rounded-2xl flex items-center gap-2 cursor-pointer active:scale-95 transition-all">
                    <span>${chip}</span>
                    <span class="text-xs text-neutral-400 font-mono">✕</span>
                  </button>
                `).join('')}
              </div>

              <!-- Available Word Chips -->
              <div class="flex items-center justify-center flex-wrap gap-3 pt-2" dir="rtl">
                ${currentEx.chips.map((chip) => `
                  <button onclick="clickChip('${chip}')" class="bg-white dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 text-neutral-900 dark:text-neutral-100 font-arabic font-semibold text-lg px-5 py-2.5 rounded-2xl transition-all active:scale-95">
                    ${chip}
                  </button>
                `).join('')}
              </div>

              <!-- Verification Result Banner -->
              ${verificationResult ? `
                <div class="p-4 rounded-2xl text-center text-sm font-semibold transition-all ${
                  verificationResult.success ? 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-900 dark:text-emerald-300' : 'bg-rose-100 dark:bg-rose-950/80 text-rose-900 dark:text-rose-300'
                }">
                  ${verificationResult.message}
                </div>
              ` : ''}

              <!-- Action Controls -->
              <div class="flex items-center justify-end gap-3 pt-2">
                <button onclick="resetChips()" class="px-4 py-2.5 rounded-full text-xs font-semibold bg-white dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-200 dark:hover:bg-neutral-700 transition-colors">
                  Reset
                </button>
                <button onclick="verifySentence()" ${selectedChips.length === 0 ? 'disabled' : ''} class="px-6 py-2.5 rounded-full text-xs font-bold bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-950 hover:opacity-90 active:scale-95 transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                  Verify Answer
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // STEP 9: PARTNER PRACTICE DIRECTIVE (PAGE 19 BOTTOM)
      else if (currentStep === 9) {
        html = `
          <div class="space-y-6">
            <div class="bg-neutral-100 dark:bg-neutral-900 p-8 rounded-3xl space-y-4 text-center">
              <p class="text-xl font-bold text-neutral-900 dark:text-neutral-100 leading-relaxed py-6">
                "Stand in pairs and point with your hand to various objects near and far, asking and answering questions."
              </p>
            </div>
          </div>
        `;
      }

      canvas.innerHTML = html;
    }

    // INITIALIZE ON LOAD
    document.addEventListener('DOMContentLoaded', () => {
      renderCanvas();
    });
  </script>
</body>
</html>
