<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <style>
    .badge { fill: #171717; }
    .outer-star { fill: #f5f5f5; }
    .middle-cutout { fill: #171717; }
    .inner-core { fill: #a3a3a3; }
    @media (prefers-color-scheme: dark) {
      .badge { fill: #f5f5f5; }
      .outer-star { fill: #171717; }
      .middle-cutout { fill: #f5f5f5; }
      .inner-core { fill: #737373; }
    }
  </style>
  <rect width="32" height="32" rx="8" class="badge" />
  <!-- Outer Rub el Hizb Star -->
  <rect x="7" y="7" width="18" height="18" rx="2.5" class="outer-star" />
  <rect x="7" y="7" width="18" height="18" rx="2.5" transform="rotate(45 16 16)" class="outer-star" />
  <!-- Middle Negative Space Carving -->
  <rect x="10.5" y="10.5" width="11" height="11" rx="1.5" class="middle-cutout" />
  <rect x="10.5" y="10.5" width="11" height="11" rx="1.5" transform="rotate(45 16 16)" class="middle-cutout" />
  <!-- Inner Morning Star Core -->
  <rect x="13.5" y="13.5" width="5" height="5" rx="0.75" class="inner-core" />
  <rect x="13.5" y="13.5" width="5" height="5" rx="0.75" transform="rotate(45 16 16)" class="inner-core" />
</svg>
