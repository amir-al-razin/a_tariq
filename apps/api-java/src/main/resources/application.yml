server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tariq-api-java
  profiles:
    active: h2 # Switch to 'postgres' for long-term production deployment

  # ---------------------------------------------------------------------------
  # Default H2 In-Memory Database (Zero-Config Developer & Lab Execution)
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:tariqdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Re-creates tables and reseeds demo data on startup
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false # Production best practice: disable Open-Session-In-View

# ---------------------------------------------------------------------------
# PostgreSQL Production Configuration Profile (Activate with -Dspring.profiles.active=postgres)
# ---------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tariq_curriculum}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.tariq.api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
